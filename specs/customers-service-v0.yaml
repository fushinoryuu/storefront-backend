openapi: 3.0.3
info:
  title: Customers service operations
  version: 0.1.0
  license:
    name: GPL-3.0-only
    url: https://www.gnu.org/licenses/gpl-3.0.html
  description: >-
    The operational routes of the customers service: a liveness check, a
    readiness check and the versions it serves. The health and version routes
    need no API key, and they are defined once in `specs/shared/paths`. The
    readiness route needs a key, because it wakes the database.
security:
  - apiKey: []
tags:
  - name: operations
    description: >-
      Health, readiness and version routes. They are not part of the versioned
      business contract.
paths:
  /v0/health:
    get:
      operationId: getHealth
      summary: Check that the service is running
      description: >-
        Answers without checking any dependency, so it says only that the
        service is running. It does not need an API key.
      tags:
        - operations
      security: []
      responses:
        '200':
          description: The service is running.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
              example:
                status: ok
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v0/health/ready:
    get:
      operationId: getReadiness
      summary: Check that the service can reach its database
      description: >-
        Runs a trivial query against the database. The database pauses when it
        is idle, and the first query after a pause makes it resume, which takes
        about 15 seconds, and 30 seconds or more after a long pause. While it
        resumes, this route answers 503 with a `Retry-After` header instead of
        waiting, so call it again after that many seconds. Tests and demos call
        it first to wake the database.


        It needs an API key, so that anonymous traffic cannot wake the database.
        Do not call it on a schedule: a database that is queried all the time
        does not pause. `GET /v0/health` never touches the database.
      tags:
        - operations
      responses:
        '200':
          description: The service reached the database.
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
                    enum:
                      - ok
              example:
                status: ok
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v0/version:
    get:
      operationId: getVersion
      summary: Report the build and the spec versions served
      description: >-
        Reports what is deployed. A caller can compare `specVersions` with the
        `info.version` of the specs it was built from. It does not need an API
        key.
      tags:
        - operations
      security: []
      responses:
        '200':
          description: The build and the spec versions served.
          content:
            application/json:
              schema:
                type: object
                required:
                  - buildId
                  - stage
                  - specVersions
                properties:
                  buildId:
                    type: string
                    description: >-
                      Identifies the build that is deployed (the commit it was
                      built from).
                  stage:
                    type: string
                    description: The stage this deployment belongs to.
                  specVersions:
                    type: object
                    description: >-
                      The `info.version` of each spec the service serves. The
                      keys are the version prefixes, which are also the suffixes
                      of the bundle files (`v0`, `v1`, `v2`).
                    additionalProperties:
                      type: string
              example:
                buildId: 7768f92
                stage: dev
                specVersions:
                  v0: 0.1.0
                  v1: 0.1.0
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
