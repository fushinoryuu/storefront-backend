# Source: services/customers/openapi.yaml
# Generated by `npm run bundle:specs`. Do not edit; change the source instead.
openapi: 3.0.3
info:
  title: Customers service
  version: 0.2.0
  license:
    name: GPL-3.0-only
    url: https://www.gnu.org/licenses/gpl-3.0.html
  description: >-
    Customer profiles and their addresses. Emails are unique, a customer is
    never removed (deleting one only marks it `deleted`), and a customer can
    have any number of addresses.


    Every route reads or writes the database, which pauses when idle. The first
    call after an idle period can answer 503 with a `Retry-After` header while
    the database resumes. Wait that many seconds and send the request again.


    This is a draft. It can change until the service is built and matches it.
security:
  - apiKey: []
tags:
  - name: customers
    description: Create, read, update and delete customers.
  - name: addresses
    description: The billing and shipping addresses of a customer.
paths:
  /v1/customers:
    post:
      operationId: createCustomer
      summary: Create a customer
      description: >-
        Creates a customer with the status `active` and version 1. The email is
        compared without regard to case, and the response has it in lowercase.


        The answer is 409 when another customer already has the email. That
        includes a deleted customer, because a deleted customer keeps its email.
      tags:
        - customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCustomer'
            example:
              email: ada.lovelace@example.com
              firstName: Ada
              lastName: Lovelace
              phone: '+14155550123'
      responses:
        '201':
          description: The customer was created.
          headers:
            Location:
              description: The path of the new customer.
              schema:
                type: string
              example: /v1/customers/3f6c2a1e-8b1d-4c52-9a53-0f4f6d2b7a10
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                customerId: 3f6c2a1e-8b1d-4c52-9a53-0f4f6d2b7a10
                email: ada.lovelace@example.com
                firstName: Ada
                lastName: Lovelace
                phone: '+14155550123'
                status: active
                version: 1
                createdAt: '2026-11-02T17:48:58Z'
                updatedAt: '2026-11-02T17:48:58Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: listCustomers
      summary: List customers
      description: >-
        Newest first. A page holds at most `limit` customers.


        Deleted customers are left out, unless `status=deleted` is asked for.
        With that filter the list holds the deleted customers and nothing else.
      tags:
        - customers
      parameters:
        - name: email
          in: query
          required: false
          description: Only the customer with this email, compared without regard to case.
          schema:
            type: string
            maxLength: 254
          example: ada.lovelace@example.com
        - name: status
          in: query
          required: false
          description: >-
            Only customers in this status. Without it the list holds the
            `active` and `suspended` customers.
          schema:
            $ref: '#/components/schemas/CustomerStatus'
          example: active
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of customers.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomerPage'
              example:
                items:
                  - customerId: 3f6c2a1e-8b1d-4c52-9a53-0f4f6d2b7a10
                    email: ada.lovelace@example.com
                    firstName: Ada
                    lastName: Lovelace
                    phone: '+14155550123'
                    status: active
                    version: 1
                    createdAt: '2026-11-02T17:48:58Z'
                    updatedAt: '2026-11-02T17:48:58Z'
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/customers/{customerId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    get:
      operationId: getCustomer
      summary: Get a customer
      description: >-
        The answer is 404 when there is no such customer, and when it is
        deleted.
      tags:
        - customers
      responses:
        '200':
          description: The customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                customerId: 3f6c2a1e-8b1d-4c52-9a53-0f4f6d2b7a10
                email: ada.lovelace@example.com
                firstName: Ada
                lastName: Lovelace
                phone: '+14155550123'
                status: active
                version: 1
                createdAt: '2026-11-02T17:48:58Z'
                updatedAt: '2026-11-02T17:48:58Z'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      operationId: updateCustomer
      summary: Update a customer
      description: >-
        Changes the fields that are in the body and leaves the others as they
        are. Send `phone` as null to remove it. `status` can move a customer
        between `active` and `suspended`. To delete a customer, use
        `deleteCustomer`.


        **Optimistic concurrency.** The body must have the `version` the caller
        last read. When the customer has a newer version, because someone else
        changed it, nothing changes and the answer is 409. Read the customer
        again and retry. A successful update adds 1 to the version.


        The answer is 409 as well when the new email belongs to another customer
        (deleted ones included). The answer is 404 when there is no such
        customer, and when it is deleted.
      tags:
        - customers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCustomer'
            example:
              version: 1
              phone: null
              status: suspended
      responses:
        '200':
          description: The customer, with its new version.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Customer'
              example:
                customerId: 3f6c2a1e-8b1d-4c52-9a53-0f4f6d2b7a10
                email: ada.lovelace@example.com
                firstName: Ada
                lastName: Lovelace
                phone: null
                status: suspended
                version: 2
                createdAt: '2026-11-02T17:48:58Z'
                updatedAt: '2026-11-03T09:15:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteCustomer
      summary: Delete a customer
      description: >-
        A soft delete: the customer gets the status `deleted` and keeps its
        data, including its email, so the email cannot be used again. A deleted
        customer is not returned by `getCustomer` and is left out of
        `listCustomers`, except for `status=deleted`.


        Deleting is idempotent. Deleting a customer that is already deleted
        answers 204 again. The answer is 404 only when there never was such a
        customer.
      tags:
        - customers
      responses:
        '204':
          description: The customer is deleted.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/customers/{customerId}/addresses:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
    post:
      operationId: addAddress
      summary: Add an address to a customer
      description: >-
        A customer has at most one default address of each type. When
        `isDefault` is true, the flag moves to this address from the customer's
        other default of the same type.


        The answer is 404 when there is no such customer, and when it is
        deleted.
      tags:
        - addresses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddress'
            example:
              type: shipping
              line1: 12 Analytical Way
              line2: Apt 3
              city: Portland
              region: OR
              postalCode: '97201'
              country: US
              isDefault: true
      responses:
        '201':
          description: The address was added.
          headers:
            Location:
              description: The path of the new address.
              schema:
                type: string
              example: /v1/customers/3f6c2a1e-8b1d-4c52-9a53-0f4f6d2b7a10/addresses/a41d9e07-52c3-4f0b-8f5e-6b1c0d9e2f33
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
              example:
                addressId: a41d9e07-52c3-4f0b-8f5e-6b1c0d9e2f33
                customerId: 3f6c2a1e-8b1d-4c52-9a53-0f4f6d2b7a10
                type: shipping
                line1: 12 Analytical Way
                line2: Apt 3
                city: Portland
                region: OR
                postalCode: '97201'
                country: US
                isDefault: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    get:
      operationId: listAddresses
      summary: List the addresses of a customer
      description: >-
        Oldest first. A page holds at most `limit` addresses.


        The answer is 404 when there is no such customer, and when it is
        deleted.
      tags:
        - addresses
      parameters:
        - name: type
          in: query
          required: false
          description: Only addresses of this type.
          schema:
            $ref: '#/components/schemas/AddressType'
          example: shipping
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of addresses.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressPage'
              example:
                items:
                  - addressId: a41d9e07-52c3-4f0b-8f5e-6b1c0d9e2f33
                    customerId: 3f6c2a1e-8b1d-4c52-9a53-0f4f6d2b7a10
                    type: shipping
                    line1: 12 Analytical Way
                    line2: Apt 3
                    city: Portland
                    region: OR
                    postalCode: '97201'
                    country: US
                    isDefault: true
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /v1/customers/{customerId}/addresses/{addressId}:
    parameters:
      - $ref: '#/components/parameters/CustomerId'
      - $ref: '#/components/parameters/AddressId'
    patch:
      operationId: updateAddress
      summary: Update an address
      description: >-
        Changes the fields that are in the body and leaves the others as they
        are. Send `line2` or `region` as null to remove them. The `type` of an
        address cannot change: delete the address and add a new one. Setting
        `isDefault` to true moves the default flag to this address from the
        customer's other default of the same type. Setting it to false leaves
        the customer with no default of this type.


        Two callers that change the same address at once do not conflict: the
        last one wins.


        The answer is 404 when there is no such customer, when it is deleted,
        and when it has no such address.
      tags:
        - addresses
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAddress'
            example:
              line2: null
              postalCode: '97202'
      responses:
        '200':
          description: The address, as it is now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
              example:
                addressId: a41d9e07-52c3-4f0b-8f5e-6b1c0d9e2f33
                customerId: 3f6c2a1e-8b1d-4c52-9a53-0f4f6d2b7a10
                type: shipping
                line1: 12 Analytical Way
                line2: null
                city: Portland
                region: OR
                postalCode: '97202'
                country: US
                isDefault: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      operationId: deleteAddress
      summary: Delete an address
      description: >-
        Removes the address for good. If it was the default of its type, the
        customer has no default of that type afterwards.


        The answer is 404 when there is no such customer, when it is deleted,
        and when it has no such address, so deleting the same address twice
        answers 404 the second time.
      tags:
        - addresses
      responses:
        '204':
          description: The address is deleted.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: >-
        An API key. There are three kinds (`tests`, `services` and `admin`), and
        each route accepts the ones it should. The key values are not in this
        repository.
  parameters:
    CustomerId:
      name: customerId
      in: path
      required: true
      description: The id of the customer.
      schema:
        type: string
        format: uuid
      example: 3f6c2a1e-8b1d-4c52-9a53-0f4f6d2b7a10
    AddressId:
      name: addressId
      in: path
      required: true
      description: The id of the address.
      schema:
        type: string
        format: uuid
      example: a41d9e07-52c3-4f0b-8f5e-6b1c0d9e2f33
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Where to continue a list. Pass the `nextCursor` of the previous page,
        unchanged. Leave it out to start at the beginning. The value is opaque
        and its format can change.
      schema:
        type: string
        minLength: 1
      example: eyJsYXN0IjoiMmY5YzQifQ
    Limit:
      name: limit
      in: query
      required: false
      description: The most items to return in one page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  schemas:
    CustomerStatus:
      type: string
      description: >-
        `active` is the normal state. `suspended` is set by an update and can be
        undone by one. `deleted` is set by `deleteCustomer` and cannot be
        undone.
      enum:
        - active
        - suspended
        - deleted
    Customer:
      type: object
      required:
        - customerId
        - email
        - firstName
        - lastName
        - phone
        - status
        - version
        - createdAt
        - updatedAt
      properties:
        customerId:
          type: string
          format: uuid
          description: The id of the customer.
        email:
          type: string
          format: email
          description: >-
            The email, in lowercase. It is unique among all customers, deleted
            ones included.
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
          nullable: true
          description: A phone number in E.164 form, or null when there is none.
        status:
          $ref: '#/components/schemas/CustomerStatus'
        version:
          type: integer
          minimum: 1
          description: >-
            Starts at 1 and goes up by 1 with every update. Send it back in
            `updateCustomer` so that a change made in between is not
            overwritten.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: When the customer last changed.
    CreateCustomer:
      type: object
      description: Unknown fields are rejected.
      required:
        - email
        - firstName
        - lastName
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          nullable: true
          pattern: ^\+[1-9][0-9]{1,14}$
          description: A phone number in E.164 form.
    UpdateCustomer:
      type: object
      description: >-
        The `version` and at least one field to change. Unknown fields are
        rejected.
      required:
        - version
      minProperties: 2
      additionalProperties: false
      properties:
        version:
          type: integer
          minimum: 1
          description: The `version` of the customer that the caller last read.
        email:
          type: string
          format: email
          maxLength: 254
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        phone:
          type: string
          nullable: true
          pattern: ^\+[1-9][0-9]{1,14}$
          description: A phone number in E.164 form. Null removes it.
        status:
          type: string
          enum:
            - active
            - suspended
    CustomerPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Customer'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    AddressType:
      type: string
      enum:
        - billing
        - shipping
    Address:
      type: object
      required:
        - addressId
        - customerId
        - type
        - line1
        - line2
        - city
        - region
        - postalCode
        - country
        - isDefault
      properties:
        addressId:
          type: string
          format: uuid
        customerId:
          type: string
          format: uuid
          description: The customer this address belongs to.
        type:
          $ref: '#/components/schemas/AddressType'
        line1:
          type: string
        line2:
          type: string
          nullable: true
        city:
          type: string
        region:
          type: string
          nullable: true
          description: The state, province or similar. Null when the country has none.
        postalCode:
          type: string
        country:
          type: string
          description: A two-letter country code (ISO 3166-1 alpha-2).
        isDefault:
          type: boolean
          description: >-
            Whether this is the customer's default address of its type. A
            customer has at most one default of each type.
    CreateAddress:
      type: object
      description: Unknown fields are rejected.
      required:
        - type
        - line1
        - city
        - postalCode
        - country
      additionalProperties: false
      properties:
        type:
          $ref: '#/components/schemas/AddressType'
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          nullable: true
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        region:
          type: string
          nullable: true
          maxLength: 100
        postalCode:
          type: string
          minLength: 1
          maxLength: 20
        country:
          type: string
          pattern: ^[A-Z]{2}$
          description: A two-letter country code (ISO 3166-1 alpha-2), in capitals.
        isDefault:
          type: boolean
          default: false
    UpdateAddress:
      type: object
      description: At least one field to change. Unknown fields are rejected.
      minProperties: 1
      additionalProperties: false
      properties:
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          nullable: true
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        region:
          type: string
          nullable: true
          maxLength: 100
        postalCode:
          type: string
          minLength: 1
          maxLength: 20
        country:
          type: string
          pattern: ^[A-Z]{2}$
          description: A two-letter country code (ISO 3166-1 alpha-2), in capitals.
        isDefault:
          type: boolean
    AddressPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    NextCursor:
      type: string
      nullable: true
      description: >-
        The cursor of the next page, or null on the last page. A list response
        is an object with `items` and a required `nextCursor` of this type, and
        the list's operation names the item schema.
      example: eyJsYXN0IjoiMmY5YzQifQ
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: >-
            The field that failed, as a path in the request (`limit`,
            `items[0].quantity`).
          example: limit
        message:
          type: string
          description: Why the value was not accepted.
          example: must be at most 100
    Problem:
      type: object
      description: >-
        The error shape of every service, including the responses API Gateway
        produces itself. It follows RFC 9457 (problem details), plus a
        correlation id.
      required:
        - type
        - title
        - status
        - correlationId
      properties:
        type:
          type: string
          description: >-
            A URI that names the kind of problem. The same kind always has the
            same value.
          example: https://storefront.example/problems/not-found
        title:
          type: string
          description: >-
            A short summary of the kind of problem. It does not change between
            occurrences.
          example: Not found
        status:
          type: integer
          description: The HTTP status code of the response.
          example: 404
        detail:
          type: string
          description: What went wrong this time, for a person reading it.
          example: There is no shipment with this id.
        correlationId:
          type: string
          description: >-
            Identifies the request in the logs of every service. It is the
            `x-correlation-id` request header, or a generated value when the
            header was missing.
          example: 6f0d6b1c-0c46-4d4c-b0b5-0c8d1f3f8f10
        errors:
          type: array
          description: >-
            The fields that failed validation. Only validation errors (400) have
            it.
          items:
            $ref: '#/components/schemas/FieldError'
  responses:
    BadRequest:
      description: The request is not valid. `errors` lists the fields that failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://storefront.example/problems/invalid-request
            title: Invalid request
            status: 400
            detail: One or more fields are not valid.
            correlationId: 6f0d6b1c-0c46-4d4c-b0b5-0c8d1f3f8f10
            errors:
              - field: limit
                message: must be at most 100
    Forbidden:
      description: >-
        The API key is missing, or it is not allowed to call this route. API
        Gateway produces this response when the key is missing or unknown.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://storefront.example/problems/forbidden
            title: Forbidden
            status: 403
            detail: The API key is missing or not allowed.
            correlationId: 6f0d6b1c-0c46-4d4c-b0b5-0c8d1f3f8f11
    TooManyRequests:
      description: >-
        The key has used up its rate or quota. API Gateway produces this
        response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://storefront.example/problems/too-many-requests
            title: Too many requests
            status: 429
            detail: The rate limit for this API key was reached.
            correlationId: 6f0d6b1c-0c46-4d4c-b0b5-0c8d1f3f8f14
    ServiceUnavailable:
      description: >-
        The service cannot answer yet. Try again after the time in
        `Retry-After`.
      headers:
        Retry-After:
          description: The seconds to wait before trying again.
          schema:
            type: integer
            minimum: 0
          example: 30
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://storefront.example/problems/service-unavailable
            title: Service unavailable
            status: 503
            detail: A service this one depends on did not answer.
            correlationId: 6f0d6b1c-0c46-4d4c-b0b5-0c8d1f3f8f15
    Conflict:
      description: The request conflicts with the current state of the resource.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://storefront.example/problems/conflict
            title: Conflict
            status: 409
            detail: The resource is not in a state that allows this.
            correlationId: 6f0d6b1c-0c46-4d4c-b0b5-0c8d1f3f8f13
    NotFound:
      description: The resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://storefront.example/problems/not-found
            title: Not found
