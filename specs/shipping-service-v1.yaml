# Source: services/shipping/openapi.yaml
# Generated by `npm run bundle:specs`. Do not edit; change the source instead.
openapi: 3.0.3
info:
  title: Shipping service
  version: 0.1.1
  license:
    name: GPL-3.0-only
    url: https://www.gnu.org/licenses/gpl-3.0.html
  description: >-
    Shipments for placed orders. The service creates a shipment when an order is
    placed and moves it through a simulated carrier, so the API only reads
    shipments, plus one admin route that moves a shipment along for tests.


    This is a draft. It can change until the service is built and matches it.
security:
  - apiKey: []
tags:
  - name: shipments
    description: Read shipments.
  - name: simulation
    description: Drive the simulated carrier. For tests, and not available in every stage.
paths:
  /v1/shipments:
    get:
      operationId: listShipments
      summary: List shipments
      description: Newest first. A page holds at most `limit` shipments.
      tags:
        - shipments
      parameters:
        - name: orderId
          in: query
          required: false
          description: Only the shipment of this order. An order has at most one.
          schema:
            type: string
          example: ord_5b8a2e1c
        - name: status
          in: query
          required: false
          description: Only shipments in this status.
          schema:
            $ref: '#/components/schemas/ShipmentStatus'
          example: SHIPPED
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: One page of shipments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentPage'
              example:
                items:
                  - shipmentId: shp_2f9c41d7
                    orderId: ord_5b8a2e1c
                    status: SHIPPED
                    carrier: Fakeship
                    trackingNumber: FS0000123456
                    createdAt: '2026-11-02T17:48:58Z'
                    updatedAt: '2026-11-02T17:52:10Z'
                nextCursor: null
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/shipments/{shipmentId}:
    get:
      operationId: getShipment
      summary: Get a shipment
      tags:
        - shipments
      parameters:
        - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          description: The shipment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
              example:
                shipmentId: shp_2f9c41d7
                orderId: ord_5b8a2e1c
                status: CREATED
                carrier: null
                trackingNumber: null
                createdAt: '2026-11-02T17:48:58Z'
                updatedAt: '2026-11-02T17:48:58Z'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/shipments/{shipmentId}/simulate/advance:
    post:
      operationId: advanceShipment
      summary: Move a shipment to its next status
      description: >-
        Moves the shipment to its next status right away, through the same code
        as the simulated carrier (`CREATED` to `PICKED`, `PICKED` to `SHIPPED`,
        `SHIPPED` to `DELIVERED`). Tests use it so they do not wait for the
        carrier.


        **Admin only.** Only the `admin` API key may call it, and any other key
        gets a 403.


        **Switched by a feature flag.** The route exists in every stage, and a
        flag decides whether it works. When the flag is off, the route answers
        404, the same as a route that does not exist, with the problem type
        `https://storefront.example/problems/not-found`. The API does not report
        the flag.


        A shipment that is `DELIVERED` or `CANCELLED` cannot advance, and the
        answer is 409.
      tags:
        - simulation
      parameters:
        - $ref: '#/components/parameters/ShipmentId'
      responses:
        '200':
          description: The shipment, in its new status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Shipment'
              example:
                shipmentId: shp_2f9c41d7
                orderId: ord_5b8a2e1c
                status: PICKED
                carrier: null
                trackingNumber: null
                createdAt: '2026-11-02T17:48:58Z'
                updatedAt: '2026-11-02T17:50:03Z'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-api-key
      description: >-
        An API key. There are three kinds (`tests`, `services` and `admin`), and
        each route accepts the ones it should. The key values are not in this
        repository.
  parameters:
    ShipmentId:
      name: shipmentId
      in: path
      required: true
      description: The id of the shipment.
      schema:
        type: string
      example: shp_2f9c41d7
    Cursor:
      name: cursor
      in: query
      required: false
      description: >-
        Where to continue a list. Pass the `nextCursor` of the previous page,
        unchanged. Leave it out to start at the beginning. The value is opaque
        and its format can change.
      schema:
        type: string
        minLength: 1
      example: eyJsYXN0IjoiMmY5YzQifQ
    Limit:
      name: limit
      in: query
      required: false
      description: The most items to return in one page.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      example: 20
  schemas:
    ShipmentStatus:
      type: string
      description: >-
        Where the shipment is. It moves forward through `CREATED`, `PICKED`,
        `SHIPPED` and `DELIVERED`. It can become `CANCELLED` until it is
        `SHIPPED`, and then it stays there.
      enum:
        - CREATED
        - PICKED
        - SHIPPED
        - DELIVERED
        - CANCELLED
    Shipment:
      type: object
      required:
        - shipmentId
        - orderId
        - status
        - carrier
        - trackingNumber
        - createdAt
        - updatedAt
      properties:
        shipmentId:
          type: string
          description: The id of the shipment.
        orderId:
          type: string
          description: The order this shipment is for. An order has at most one shipment.
        status:
          $ref: '#/components/schemas/ShipmentStatus'
        carrier:
          type: string
          nullable: true
          description: The simulated carrier. It is null until the shipment is `SHIPPED`.
        trackingNumber:
          type: string
          nullable: true
          description: >-
            A made-up tracking number. It is null until the shipment is
            `SHIPPED`.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          description: When the status last changed.
    ShipmentPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Shipment'
        nextCursor:
          $ref: '#/components/schemas/NextCursor'
    NextCursor:
      type: string
      nullable: true
      description: >-
        The cursor of the next page, or null on the last page. A list response
        is an object with `items` and a required `nextCursor` of this type, and
        the list's operation names the item schema.
      example: eyJsYXN0IjoiMmY5YzQifQ
    FieldError:
      type: object
      required:
        - field
        - message
      properties:
        field:
          type: string
          description: >-
            The field that failed, as a path in the request (`limit`,
            `items[0].quantity`).
          example: limit
        message:
          type: string
          description: Why the value was not accepted.
          example: must be at most 100
    Problem:
      type: object
      description: >-
        The error shape of every service, including the responses API Gateway
        produces itself. It follows RFC 9457 (problem details), plus a
        correlation id.
      required:
        - type
        - title
        - status
        - correlationId
      properties:
        type:
          type: string
          description: >-
            A URI that names the kind of problem. The same kind always has the
            same value.
          example: https://storefront.example/problems/not-found
        title:
          type: string
          description: >-
            A short summary of the kind of problem. It does not change between
            occurrences.
          example: Not found
        status:
          type: integer
          description: The HTTP status code of the response.
          example: 404
        detail:
          type: string
          description: What went wrong this time, for a person reading it.
          example: There is no shipment with this id.
        correlationId:
          type: string
          description: >-
            Identifies the request in the logs of every service. It is the
            `x-correlation-id` request header, or a generated value when the
            header was missing.
          example: 6f0d6b1c-0c46-4d4c-b0b5-0c8d1f3f8f10
        errors:
          type: array
          description: >-
            The fields that failed validation. Only validation errors (400) have
            it.
          items:
            $ref: '#/components/schemas/FieldError'
  responses:
    BadRequest:
      description: The request is not valid. `errors` lists the fields that failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://storefront.example/problems/invalid-request
            title: Invalid request
            status: 400
            detail: One or more fields are not valid.
            correlationId: 6f0d6b1c-0c46-4d4c-b0b5-0c8d1f3f8f10
            errors:
              - field: limit
                message: must be at most 100
    Forbidden:
      description: >-
        The API key is missing, or it is not allowed to call this route. API
        Gateway produces this response when the key is missing or unknown.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: https://storefront.example/problems/forbidden
            title: Forbidden
            status: 403
            detail: The API key is missing or not allowed.
            correlationId: 6f0d6b1c-0c46-4d4c-b0b5-0c8d1f3f8f11
    TooManyRequests:
      description: >-
        The key has used up its rate or quota. API Gateway produces this
