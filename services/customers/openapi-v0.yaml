openapi: 3.0.3
info:
  title: Customers service operations
  version: 0.1.0
  license:
    name: GPL-3.0-only
    url: https://www.gnu.org/licenses/gpl-3.0.html
  description: >-
    The operational routes of the customers service: a liveness check, a readiness check and the
    versions it serves. The health and version routes need no API key, and they are defined once in
    `specs/shared/paths`. The readiness route needs a key, because it wakes the database.
security:
  - apiKey: []
tags:
  - name: operations
    description: Health, readiness and version routes. They are not part of the versioned business contract.
paths:
  /v0/health:
    $ref: '../../specs/shared/paths/health.yaml'
  /v0/health/ready:
    get:
      operationId: getReadiness
      summary: Check that the service can reach its database
      description: >-
        Runs a trivial query against the database. The database pauses when it is idle, and the
        first query after a pause makes it resume, which takes about 15 seconds, and 30 seconds or
        more after a long pause. While it resumes, this route answers 503 with a `Retry-After`
        header instead of waiting, so call it again after that many seconds. Tests and demos call
        it first to wake the database.


        It needs an API key, so that anonymous traffic cannot wake the database. Do not call it on
        a schedule: a database that is queried all the time does not pause. `GET /v0/health` never
        touches the database.
      tags: [operations]
      responses:
        '200':
          description: The service reached the database.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [ok]
              example:
                status: ok
        '403':
          $ref: '../../specs/shared/components.yaml#/components/responses/Forbidden'
        '429':
          $ref: '../../specs/shared/components.yaml#/components/responses/TooManyRequests'
        '503':
          $ref: '../../specs/shared/components.yaml#/components/responses/ServiceUnavailable'
  /v0/version:
    $ref: '../../specs/shared/paths/version.yaml'
components:
  securitySchemes:
    apiKey:
      $ref: '../../specs/shared/components.yaml#/components/securitySchemes/apiKey'
