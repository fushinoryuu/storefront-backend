version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Each release of `@vitest/coverage-v8` needs exactly the same version of `vitest` (its peer dependency), so the two always move in one pull request.
      # This group is listed first, because a package goes to the first group that matches it. It takes every update type, major included.
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      # One pull request for all the other minor and patch updates. A major update is not in a group, so it gets its own.
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Decision 0004: the schema generator (`@hey-api/openapi-ts`) fails to start on TypeScript 7, so TypeScript stays on 6.x.
      # Remove this rule when a release of the generator supports TypeScript 7 and decision 0004 is amended.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
      # The type definitions follow the Node.js version the code runs on (`.nvmrc`, `engines` and the Lambda runtime), which is 24.
      # A newer major would let code use APIs that the runtime does not have, and the type check would still pass.
      # Remove this rule in the change that moves the project to a newer Node.js, and move `@types/node` in the same change.
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  # The image of DynamoDB Local that the tests run against (docker-compose.yaml).
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
