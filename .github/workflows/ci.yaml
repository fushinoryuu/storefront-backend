name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      # The image and its version are named in docker-compose.yaml only.
      - name: Get DynamoDB Local image version
        id: dynamodb-local
        run: echo "image=$(docker compose config --images)" >> "$GITHUB_OUTPUT"

      - name: Restore DynamoDB Local image
        uses: fushinoryuu/gha-workflows/.github/actions/cache-docker-image@main
        with:
          cache-key: dynamodb-local-${{ hashFiles('docker-compose.yaml') }}
          full-image-name: ${{ steps.dynamodb-local.outputs.image }}

      - name: Start DynamoDB Local
        run: docker compose up --detach --wait

      - run: npm test -- --coverage

      - name: Comment on the PR with the coverage report
        uses: fushinoryuu/gha-workflows/.github/actions/code-coverage-pr-comment@main
        with:
          coverage-report-path: ./coverage/coverage-summary.json

      - name: Show the logs of DynamoDB Local
        if: failure()
        run: docker compose logs dynamodb

      - name: Upload the coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - run: npm run lint:specs

      - run: npm run bundle:specs -- --check

      - run: npm run synth
