name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - run: npm run typecheck

      - name: Start DynamoDB Local
        run: |
          docker run -d --name dynamodb-local -p 8000:8000 amazon/dynamodb-local:3.3.2 -jar DynamoDBLocal.jar -inMemory -sharedDb
          for attempt in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8000 && exit 0
            sleep 1
          done
          docker logs dynamodb-local
          exit 1

      - run: npm test
        env:
          DYNAMODB_ENDPOINT: http://localhost:8000

      - run: npm run lint:specs

      - run: npm run bundle:specs -- --check

      - run: npm run synth
