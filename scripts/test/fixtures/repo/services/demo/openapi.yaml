openapi: 3.0.3
info:
  title: Demo service
  version: 0.1.0
security:
  - apiKey: []
paths:
  /v1/things:
    get:
      operationId: listThings
      summary: List things
      tags: [things]
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: One page of things.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Thing'
                  nextCursor:
                    type: string
                    nullable: true
              example:
                items:
                  - id: 1d7c3f0a-5f5e-4c53-9d0e-0b6a5f0e9a01
                    name: Widget
                nextCursor: null
        '400':
          $ref: '../../specs/shared/components.yaml#/components/responses/BadRequest'
        '403':
          $ref: '../../specs/shared/components.yaml#/components/responses/Forbidden'
    post:
      operationId: createThing
      summary: Create a thing
      tags: [things]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewThing'
            example:
              name: Widget
      responses:
        '201':
          description: The thing was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thing'
              example:
                id: 1d7c3f0a-5f5e-4c53-9d0e-0b6a5f0e9a01
                name: Widget
        '400':
          $ref: '../../specs/shared/components.yaml#/components/responses/BadRequest'
        '403':
          $ref: '../../specs/shared/components.yaml#/components/responses/Forbidden'
  /v1/things/{thingId}:
    get:
      operationId: getThing
      summary: Get a thing
      tags: [things]
      parameters:
        - name: thingId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The thing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thing'
              example:
                id: 1d7c3f0a-5f5e-4c53-9d0e-0b6a5f0e9a01
                name: Widget
        '403':
          $ref: '../../specs/shared/components.yaml#/components/responses/Forbidden'
        '404':
          $ref: '../../specs/shared/components.yaml#/components/responses/NotFound'
components:
  securitySchemes:
    apiKey:
      $ref: '../../specs/shared/components.yaml#/components/securitySchemes/apiKey'
  schemas:
    NewThing:
      type: object
      required: [name]
      properties:
        name:
          type: string
    Thing:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
